<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI响应测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
        }
        .test-section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 3px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        button {
            padding: 8px 16px;
            margin: 5px;
            border: none;
            border-radius: 3px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0069d9;
        }
        input {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>AI响应测试</h1>
    
    <div class="test-section">
        <h2>1. 测试getAIResponse函数</h2>
        <input type="text" id="test-message" value="你好" placeholder="输入测试消息">
        <button onclick="testAIResponse()">测试响应</button>
        <div id="test-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. 测试核心函数是否存在</h2>
        <button onclick="testCoreFunctions()">测试核心函数</button>
        <div id="core-functions-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>3. 测试本地响应系统</h2>
        <button onclick="testLocalResponse()">测试本地响应</button>
        <div id="local-response-result" class="result"></div>
    </div>

    <!-- 加载增强的AI助手脚本 -->
    <script src="enhanced-ai-assistant.js"></script>
    
    <script>
        // 测试AI响应
        function testAIResponse() {
            const message = document.getElementById('test-message').value;
            const resultDiv = document.getElementById('test-result');
            
            resultDiv.innerHTML = '<p>测试中...</p>';
            resultDiv.className = 'result';
            
            console.log('测试消息:', message);
            
            if (typeof window.getAIResponse === 'function') {
                console.log('getAIResponse函数存在，调用中...');
                
                // 调用getAIResponse函数
                window.getAIResponse(message)
                    .then(response => {
                        console.log('获取到响应:', response);
                        resultDiv.innerHTML = `<p><strong>输入:</strong> ${message}</p><p><strong>响应:</strong> ${response}</p>`;
                        resultDiv.className = 'result success';
                    })
                    .catch(error => {
                        console.error('响应错误:', error);
                        resultDiv.innerHTML = `<p>错误: ${error.message}</p>`;
                        resultDiv.className = 'result error';
                    });
            } else {
                console.error('getAIResponse函数不存在');
                resultDiv.innerHTML = '<p>错误: getAIResponse函数不存在</p>';
                resultDiv.className = 'result error';
            }
        }
        
        // 测试核心函数是否存在
        function testCoreFunctions() {
            const resultDiv = document.getElementById('core-functions-result');
            
            const functions = {
                addMessage: typeof window.addMessage === 'function',
                getAIResponse: typeof window.getAIResponse === 'function',
                addLoadingMessage: typeof window.addLoadingMessage === 'function',
                removeLoadingMessage: typeof window.removeLoadingMessage === 'function'
            };
            
            console.log('核心函数状态:', functions);
            
            let html = '<ul>';
            for (const [name, exists] of Object.entries(functions)) {
                html += `<li>${name}: ${exists ? '<span style="color: green;">存在</span>' : '<span style="color: red;">不存在</span>'}</li>`;
            }
            html += '</ul>';
            
            resultDiv.innerHTML = html;
            resultDiv.className = 'result success';
        }
        
        // 测试本地响应系统
        function testLocalResponse() {
            const resultDiv = document.getElementById('local-response-result');
            
            // 测试不同类型的消息
            const testMessages = [
                '你好',
                '教育行业解决方案',
                '预算8000元',
                '推荐一款Surface产品'
            ];
            
            let html = '<h3>本地响应测试结果:</h3>';
            
            testMessages.forEach(message => {
                if (typeof window.getAIResponse === 'function') {
                    window.getAIResponse(message)
                        .then(response => {
                            html += `<p><strong>输入:</strong> ${message}</p><p><strong>响应:</strong> ${response}</p><hr>`;
                            resultDiv.innerHTML = html;
                            resultDiv.className = 'result success';
                        })
                        .catch(error => {
                            html += `<p><strong>输入:</strong> ${message}</p><p><strong>错误:</strong> ${error.message}</p><hr>`;
                            resultDiv.innerHTML = html;
                            resultDiv.className = 'result error';
                        });
                }
            });
        }
        
        // 页面加载完成后测试核心函数
        window.addEventListener('load', function() {
            console.log('页面加载完成，开始测试...');
            testCoreFunctions();
        });
    </script>
</body>
</html>
