<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单AI助手测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .test-result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        .test-pass {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .test-fail {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        #chat-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        .user-message {
            background-color: #e3f2fd;
            align-self: flex-end;
        }
        .ai-message {
            background-color: #f3e5f5;
            align-self: flex-start;
        }
        .loading {
            background-color: #fff3e0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>简单AI助手测试</h1>
    
    <div class="test-section">
        <h2>1. 核心功能测试</h2>
        <button onclick="testCoreFunctions()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">测试核心函数</button>
        <div id="core-test-result" class="test-result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. 聊天测试</h2>
        <div id="chat-container"></div>
        <input type="text" id="chat-input" placeholder="输入消息" value="你好" class="px-4 py-2 border rounded" style="width: 300px;">
        <button onclick="sendMessage()" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">发送</button>
        <div id="chat-test-result" class="test-result"></div>
    </div>

    <script>
        // 模拟AI助手的核心函数
        function addMessage(type, content) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type === 'user' ? 'user-message' : 'ai-message'}`;
            messageDiv.innerHTML = `<strong>${type === 'user' ? '你' : 'AI'}:</strong> ${content}`;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }
        
        function addLoadingMessage() {
            const chatContainer = document.getElementById('chat-container');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message loading';
            loadingDiv.id = 'loading-' + Date.now();
            loadingDiv.innerHTML = '<strong>AI:</strong> 思考中...';
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return loadingDiv.id;
        }
        
        function removeLoadingMessage(id) {
            const loadingDiv = document.getElementById(id);
            if (loadingDiv) {
                loadingDiv.remove();
            }
        }
        
        async function getAIResponse(message, history = '') {
            console.log('获取AI响应:', message);
            
            // 模拟增强的本地响应
            const lowerMessage = message.toLowerCase();
            
            // 问候语处理
            if (lowerMessage.includes('你好') || lowerMessage.includes('您好') || lowerMessage.includes('hi') || lowerMessage.includes('hello')) {
                return '您好！我是Surface AI智能助手，很高兴为您服务。请问您需要了解哪方面的Surface产品或解决方案？';
            }
            
            // 感谢语处理
            if (lowerMessage.includes('谢谢') || lowerMessage.includes('感谢')) {
                return '不客气！如果您还有任何关于Surface产品的问题，随时告诉我，我会很乐意为您解答。';
            }
            
            // 教育行业
            if (lowerMessage.includes('教育') || lowerMessage.includes('学校') || lowerMessage.includes('老师') || lowerMessage.includes('学生')) {
                return '根据您的教育行业需求，我推荐Surface Pro 12和Surface Laptop Go 3的组合方案。\n\n**推荐理由：**\n- **Surface Pro 12**：适合教师移动教学和课堂演示，支持触控笔书写，便于在课堂上实时标注和讲解。\n- **Surface Laptop Go 3**：适合学生日常学习和作业完成，轻薄便携，续航时间长。\n\n**预算范围**：8000-15000元';
            }
            
            // 默认响应
            return '感谢您的咨询。为了给您提供更精准的Surface产品解决方案，我需要了解更多信息：\n\n1. **使用场景**：您主要在什么环境下使用？\n2. **核心需求**：您最看重哪些功能？\n3. **预算范围**：您的预算大概是多少？\n4. **特殊要求**：是否有其他特殊需求？';
        }
        
        // 测试核心函数
        function testCoreFunctions() {
            const resultDiv = document.getElementById('core-test-result');
            let results = [];
            
            // 测试核心函数
            const functionsToTest = [
                'addMessage',
                'addLoadingMessage',
                'removeLoadingMessage',
                'getAIResponse'
            ];
            
            functionsToTest.forEach(funcName => {
                if (typeof window[funcName] === 'function') {
                    results.push(`✅ ${funcName} 函数存在`);
                } else {
                    results.push(`❌ ${funcName} 函数不存在`);
                }
            });
            
            // 显示结果
            resultDiv.innerHTML = results.join('<br>');
            resultDiv.className = 'test-result test-pass';
        }
        
        // 发送消息
        async function sendMessage() {
            const message = document.getElementById('chat-input').value;
            const resultDiv = document.getElementById('chat-test-result');
            
            if (!message) {
                resultDiv.innerHTML = '请输入消息';
                resultDiv.className = 'test-result test-fail';
                return;
            }
            
            try {
                // 添加用户消息
                addMessage('user', message);
                
                // 显示加载状态
                const loadingId = addLoadingMessage();
                
                // 获取AI响应
                const response = await getAIResponse(message);
                
                // 移除加载状态
                removeLoadingMessage(loadingId);
                
                // 添加AI消息
                addMessage('ai', response);
                
                // 清空输入框
                document.getElementById('chat-input').value = '';
                
                resultDiv.innerHTML = '消息发送成功';
                resultDiv.className = 'test-result test-pass';
            } catch (error) {
                resultDiv.innerHTML = `错误: ${error.message}`;
                resultDiv.className = 'test-result test-fail';
            }
        }
        
        // 页面加载完成后测试
        window.addEventListener('load', function() {
            console.log('页面加载完成，开始测试...');
            testCoreFunctions();
        });
    </script>
</body>
</html>
