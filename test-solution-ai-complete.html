<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解决方案智能助手完整测试</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .test-result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        .test-pass {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .test-fail {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        #chat-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        .user-message {
            background-color: #e3f2fd;
            align-self: flex-end;
        }
        .ai-message {
            background-color: #f3e5f5;
            align-self: flex-start;
        }
        .loading {
            background-color: #fff3e0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>解决方案智能助手完整测试</h1>
    
    <div class="test-section">
        <h2>1. 导航到解决方案页面</h2>
        <button id="nav-to-solutions" class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-primary-dark transition-colors">
            <i class="fa fa-lightbulb-o mr-2"></i> 解决方案推荐
        </button>
        <div id="nav-test-result" class="test-result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. 解决方案智能助手按钮测试</h2>
        <div id="solution-page-content" class="hidden">
            <div class="mt-4 flex justify-end space-x-4">
                <button id="solution-ai-assistant-btn" class="px-6 py-2 bg-secondary text-dark rounded-lg hover:bg-secondary-dark transition-colors flex items-center">
                    <i class="fa fa-robot mr-2"></i> 解决方案智能助手
                </button>
                <button id="generate-solution-btn" class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-primary-dark transition-colors flex items-center">
                    <i class="fa fa-magic mr-2"></i> 生成解决方案
                </button>
            </div>
        </div>
        <div id="button-test-result" class="test-result"></div>
    </div>
    
    <div class="test-section">
        <h2>3. 聊天功能测试</h2>
        <div id="ai-assistant-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[80vh] flex flex-col">
                <!-- 模态框头部 -->
                <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                    <h3 class="text-lg font-semibold text-gray-900 flex items-center">
                        <i class="fa fa-robot text-purple-600 mr-2"></i>
                        解决方案智能助手
                    </h3>
                    <button id="close-ai-assistant" class="text-gray-400 hover:text-gray-600">
                        <i class="fa fa-times text-xl"></i>
                    </button>
                </div>
                
                <!-- 对话内容区域 -->
                <div id="ai-chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
                    <!-- 系统欢迎消息 -->
                    <div class="flex items-start">
                        <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center flex-shrink-0 mr-3">
                            <i class="fa fa-robot text-white"></i>
                        </div>
                        <div class="bg-white rounded-lg p-3 shadow-sm max-w-[80%]">
                            <p class="text-gray-800">您好！我是Surface解决方案智能助手，很高兴为您服务。请描述您的需求，我将为您提供专业的Surface解决方案建议。</p>
                            <p class="text-gray-600 text-sm mt-2">例如："我们是一家教育机构，需要为教师配备适合教学的设备，预算在8000元左右"</p>
                        </div>
                    </div>
                </div>
                
                <!-- 输入区域 -->
                <div class="p-4 border-t border-gray-200">
                    <form id="ai-chat-form" class="flex space-x-2">
                        <input type="text" id="ai-message-input" placeholder="请描述您的需求..." class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        <button type="submit" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors">
                            <i class="fa fa-paper-plane"></i>
                        </button>
                    </form>
                    <div class="mt-2 text-xs text-gray-500 text-center">
                        <p>您也可以使用语音输入 <button id="voice-input-btn" class="text-purple-600 hover:underline ml-1"><i class="fa fa-microphone"></i> 开始语音</button></p>
                    </div>
                </div>
            </div>
        </div>
        <div id="chat-test-result" class="test-result"></div>
    </div>

    <script>
        // 全局变量
        let messageHistory = [];

        // 添加消息到聊天界面
        function addMessage(type, content) {
            const chatContainer = document.getElementById('ai-chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = type === 'user' ? 'flex items-start justify-end' : 'flex items-start';
            
            if (type === 'user') {
                messageDiv.innerHTML = `
                    <div class="bg-primary bg-opacity-10 rounded-lg p-3 shadow-sm max-w-[80%]">
                        <p class="text-gray-800">${content}</p>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-gray-300 flex items-center justify-center flex-shrink-0 ml-3">
                        <i class="fa fa-user text-gray-600"></i>
                    </div>
                `;
                // 添加到历史记录
                messageHistory.push({ type: 'user', content: content });
            } else {
                messageDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center flex-shrink-0 mr-3">
                        <i class="fa fa-robot text-white"></i>
                    </div>
                    <div class="bg-white rounded-lg p-3 shadow-sm max-w-[80%]">
                        <p class="text-gray-800">${content}</p>
                    </div>
                `;
                // 添加到历史记录
                messageHistory.push({ type: 'ai', content: content });
            }
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        // 添加加载消息
        function addLoadingMessage() {
            const chatContainer = document.getElementById('ai-chat-container');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'flex items-start';
            loadingDiv.id = 'loading-' + Date.now();
            loadingDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center flex-shrink-0 mr-3">
                    <i class="fa fa-robot text-white"></i>
                </div>
                <div class="bg-white rounded-lg p-3 shadow-sm flex items-center">
                    <div class="animate-pulse flex space-x-2">
                        <div class="w-2 h-2 rounded-full bg-gray-400"></div>
                        <div class="w-2 h-2 rounded-full bg-gray-400"></div>
                        <div class="w-2 h-2 rounded-full bg-gray-400"></div>
                    </div>
                </div>
            `;
            
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return loadingDiv.id;
        }

        // 移除加载消息
        function removeLoadingMessage(id) {
            const loadingDiv = document.getElementById(id);
            if (loadingDiv) {
                loadingDiv.remove();
            }
        }

        // 获取AI响应
        function getAIResponse(message, history = '') {
            console.log('获取AI响应:', message);
            
            // 简单的关键词匹配
            const lowerMessage = message.toLowerCase();
            
            // 问候语处理
            if (lowerMessage.includes('你好') || lowerMessage.includes('您好') || lowerMessage.includes('hi') || lowerMessage.includes('hello')) {
                return '您好！我是解决方案智能助手，很高兴为您服务。请问您需要了解哪方面的Surface产品或解决方案？';
            }
            
            // 感谢语处理
            if (lowerMessage.includes('谢谢') || lowerMessage.includes('感谢')) {
                return '不客气！如果您还有任何关于Surface产品的问题，随时告诉我，我会很乐意为您解答。';
            }
            
            // 教育行业
            if (lowerMessage.includes('教育') || lowerMessage.includes('学校') || lowerMessage.includes('老师') || lowerMessage.includes('学生')) {
                return '根据您的教育行业需求，我推荐Surface Pro 12和Surface Laptop Go 3的组合方案。\n\n**推荐理由：**\n- **Surface Pro 12**：适合教师移动教学和课堂演示，支持触控笔书写，便于在课堂上实时标注和讲解。\n- **Surface Laptop Go 3**：适合学生日常学习和作业完成，轻薄便携，续航时间长。\n\n**预算范围**：8000-15000元';
            }
            
            // 预算相关
            if (lowerMessage.includes('预算') || lowerMessage.includes('价格') || lowerMessage.includes('多少钱')) {
                return 'Surface产品有多个价格区间，适合不同的预算需求：\n\n**入门级**（5000-8000元）：Surface Go 4、Surface Laptop Go 3\n**中端**（8000-15000元）：Surface Pro 12、Surface Laptop 13\n**高端**（15000元以上）：Surface Laptop Studio 2、Surface Pro 13';
            }
            
            // 默认响应
            return '感谢您的咨询。为了给您提供更精准的Surface产品解决方案，我需要了解更多信息：\n\n1. **使用场景**：您主要在什么环境下使用？\n2. **核心需求**：您最看重哪些功能？\n3. **预算范围**：您的预算大概是多少？\n4. **特殊要求**：是否有其他特殊需求？';
        }

        // 设置表单处理器
        function setupAIAssistantForm() {
            const aiChatForm = document.getElementById('ai-chat-form');
            const aiMessageInput = document.getElementById('ai-message-input');
            const aiChatContainer = document.getElementById('ai-chat-container');
            
            console.log('setupAIAssistantForm: 查找表单元素...', {
                aiChatForm: !!aiChatForm,
                aiMessageInput: !!aiMessageInput,
                aiChatContainer: !!aiChatContainer
            });
            
            if (aiChatForm && aiMessageInput && aiChatContainer) {
                console.log('setupAIAssistantForm: 找到表单元素，添加事件监听器');
                
                // 移除可能存在的事件监听器
                const newForm = aiChatForm.cloneNode(true);
                aiChatForm.parentNode.replaceChild(newForm, aiChatForm);
                
                // 获取新的表单和输入元素引用
                const updatedAiChatForm = document.getElementById('ai-chat-form');
                const updatedAiMessageInput = document.getElementById('ai-message-input');
                
                console.log('setupAIAssistantForm: 更新后的表单元素:', {
                    updatedAiChatForm: !!updatedAiChatForm,
                    updatedAiMessageInput: !!updatedAiMessageInput
                });
                
                if (updatedAiChatForm && updatedAiMessageInput) {
                    // 添加提交事件监听器
                    updatedAiChatForm.addEventListener('submit', function(e) {
                        e.preventDefault();
                        console.log('setupAIAssistantForm: 表单提交事件触发');
                        const message = updatedAiMessageInput.value.trim();
                        if (message) {
                            console.log('setupAIAssistantForm: 发送消息:', message);
                            
                            // 添加用户消息
                            addMessage('user', message);
                            updatedAiMessageInput.value = '';
                            
                            // 显示加载状态
                            const loadingId = addLoadingMessage();
                            console.log('setupAIAssistantForm: 显示加载状态:', loadingId);
                            
                            // 处理AI响应（使用Promise处理）
                            try {
                                console.log('setupAIAssistantForm: 调用getAIResponse函数...');
                                
                                // 检查是否为Promise
                                const aiResponse = getAIResponse(message);
                                console.log('setupAIAssistantForm: getAIResponse返回值类型:', typeof aiResponse);
                                
                                if (aiResponse && typeof aiResponse.then === 'function') {
                                    // 是Promise
                                    console.log('setupAIAssistantForm: 处理Promise响应...');
                                    aiResponse.then(response => {
                                        console.log('setupAIAssistantForm: 获取到响应:', response);
                                        removeLoadingMessage(loadingId);
                                        addMessage('ai', response);
                                        console.log('setupAIAssistantForm: 添加AI回复到聊天界面');
                                        
                                        // 更新测试结果
                                        const chatTestResult = document.getElementById('chat-test-result');
                                        chatTestResult.innerHTML = '✅ 聊天功能测试成功，AI助手已响应';
                                        chatTestResult.className = 'test-result test-pass';
                                    }).catch(error => {
                                        console.error('setupAIAssistantForm: Promise错误:', error);
                                        removeLoadingMessage(loadingId);
                                        addMessage('ai', '抱歉，AI服务暂时不可用，请稍后重试。');
                                        
                                        // 更新测试结果
                                        const chatTestResult = document.getElementById('chat-test-result');
                                        chatTestResult.innerHTML = '❌ 聊天功能测试失败: ' + error.message;
                                        chatTestResult.className = 'test-result test-fail';
                                    });
                                } else {
                                    // 不是Promise，直接使用
                                    console.log('setupAIAssistantForm: 获取到响应:', aiResponse);
                                    removeLoadingMessage(loadingId);
                                    addMessage('ai', aiResponse);
                                    console.log('setupAIAssistantForm: 添加AI回复到聊天界面');
                                    
                                    // 更新测试结果
                                    const chatTestResult = document.getElementById('chat-test-result');
                                    chatTestResult.innerHTML = '✅ 聊天功能测试成功，AI助手已响应';
                                    chatTestResult.className = 'test-result test-pass';
                                }
                            } catch (error) {
                                console.error('setupAIAssistantForm: AI响应错误:', error);
                                removeLoadingMessage(loadingId);
                                addMessage('ai', '抱歉，AI服务暂时不可用，请稍后重试。');
                                
                                // 更新测试结果
                                const chatTestResult = document.getElementById('chat-test-result');
                                chatTestResult.innerHTML = '❌ 聊天功能测试失败: ' + error.message;
                                chatTestResult.className = 'test-result test-fail';
                            }
                        }
                    });
                } else {
                    console.warn('setupAIAssistantForm: 更新后的表单元素未找到');
                    
                    // 更新测试结果
                    const chatTestResult = document.getElementById('chat-test-result');
                    chatTestResult.innerHTML = '❌ 聊天功能测试失败: 更新后的表单元素未找到';
                    chatTestResult.className = 'test-result test-fail';
                }
            } else {
                console.warn('setupAIAssistantForm: 未找到表单元素');
                
                // 更新测试结果
                const chatTestResult = document.getElementById('chat-test-result');
                chatTestResult.innerHTML = '❌ 聊天功能测试失败: 未找到表单元素';
                chatTestResult.className = 'test-result test-fail';
            }
        }

        // 页面加载完成后测试
        window.addEventListener('load', function() {
            console.log('页面加载完成，开始测试...');
            
            // 测试导航到解决方案页面
            const navToSolutionsBtn = document.getElementById('nav-to-solutions');
            const navTestResult = document.getElementById('nav-test-result');
            const solutionPageContent = document.getElementById('solution-page-content');
            
            navToSolutionsBtn.addEventListener('click', function() {
                console.log('导航到解决方案页面');
                solutionPageContent.classList.remove('hidden');
                navTestResult.innerHTML = '✅ 导航到解决方案页面成功';
                navTestResult.className = 'test-result test-pass';
                
                // 测试解决方案智能助手按钮
                setTimeout(function() {
                    testSolutionAiButton();
                }, 500);
            });
            
            // 测试解决方案智能助手按钮
            function testSolutionAiButton() {
                const solutionAiBtn = document.getElementById('solution-ai-assistant-btn');
                const buttonTestResult = document.getElementById('button-test-result');
                const aiAssistantModal = document.getElementById('ai-assistant-modal');
                
                if (solutionAiBtn) {
                    buttonTestResult.innerHTML = '✅ 解决方案智能助手按钮存在';
                    buttonTestResult.className = 'test-result test-pass';
                    
                    // 为按钮添加点击事件监听器
                    solutionAiBtn.addEventListener('click', function() {
                        console.log('解决方案智能助手按钮被点击');
                        aiAssistantModal.classList.remove('hidden');
                        buttonTestResult.innerHTML = '✅ 解决方案智能助手按钮被点击，模态框已显示';
                        buttonTestResult.className = 'test-result test-pass';
                        
                        // 模态框显示后，为表单添加提交事件监听器
                        setTimeout(function() {
                            setupAIAssistantForm();
                        }, 100);
                    });
                } else {
                    buttonTestResult.innerHTML = '❌ 解决方案智能助手按钮不存在';
                    buttonTestResult.className = 'test-result test-fail';
                }
            }
            
            // 为关闭按钮添加事件监听器
            const closeAiAssistant = document.getElementById('close-ai-assistant');
            if (closeAiAssistant) {
                closeAiAssistant.addEventListener('click', function() {
                    console.log('关闭AI助手模态框');
                    document.getElementById('ai-assistant-modal').classList.add('hidden');
                });
            }
        });
    </script>
</body>
</html>
